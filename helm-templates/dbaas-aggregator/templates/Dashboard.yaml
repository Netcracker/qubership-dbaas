{{ if eq (.Values.MONITORING_ENABLED | toString | lower) "true" }}
---
apiVersion: integreatly.org/v1alpha1
kind: GrafanaDashboard
metadata:
  name: dbaas-dashboard
  labels:
    app: grafana
    {{- include "dbaas.basicLabels" . | nindent 4 }}
spec:
  name: dbaas-dashboard.json
  json: {{ .Files.Get  "dashboards/dbaas-dashboard.json" | toJson | replace "#namespace#" .Values.NAMESPACE }}
{{ end }}
