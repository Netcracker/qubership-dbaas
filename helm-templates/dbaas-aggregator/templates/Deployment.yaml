{{- $arg := .Values.APPLICATION_NAME | default "dbaas" -}}
{{- $b64p := tpl (.Files.Get "data/policy.json") $ | b64enc }}
{{- $sha1sum := sha1sum $b64p }}
{{- $tlsEnabled := eq (.Values.INTERNAL_TLS_ENABLED | toString | lower) "true" }}
{{- $readOnly := and .Values.READONLY_CONTAINER_FILE_SYSTEM_ENABLED (eq .Values.PAAS_PLATFORM "KUBERNETES") }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: '{{ .Values.SERVICE_NAME }}'
    labels:
        name: '{{ .Values.SERVICE_NAME }}'
        {{- include "dbaas.resourceLabels" . | nindent 8 }}
spec:
    replicas: {{ .Values.REPLICAS | default 1 }}
    strategy:
{{- if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "recreate" }}
        type: Recreate
{{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "best_effort_controlled_rollout" }}
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 0
            maxUnavailable: 80%
{{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "ramped_slow_rollout" }}
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
{{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "custom_rollout" }}
        type: RollingUpdate
        rollingUpdate:
            maxSurge: {{ .Values.DEPLOYMENT_STRATEGY_MAXSURGE | default "25%" }}
            maxUnavailable: {{ .Values.DEPLOYMENT_STRATEGY_MAXUNAVAILABLE | default "25%" }}
{{- else if .Values.DBAAS_RECREATE_DEPLOYMENT_STRATEGY }}
        type: Recreate
{{- else }}
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
{{- end }}
    template:
        metadata:
            labels:
                name: '{{ .Values.SERVICE_NAME }}'
                {{- include "dbaas.resourceLabels" . | nindent 16 }}
        spec:
            nodeSelector:
                {{ .Values.NODE_SELECTOR_DBAAS_KEY }}: '{{ .Values.REGION_DBAAS }}'
            serviceAccountName: '{{ .Values.SERVICE_NAME }}'
            volumes:
              - name: dbaas-security-volume
                projected:
                  sources:
                    - secret:
                        name: dbaas-security-configuration-secret
                    - secret:
                        name: dbaas-security-service-account-roles-secret
              - name: dbaas-global-permissions-configuration-volume
                secret:
                    secretName: 'dbaas-global-permissions-configuration-secret'
              - name: pod-secrets
                projected:
                    sources:
                    -   secret:
                            name: 'dbaas-storage-credentials'
                            items:
                            -   key: username
                                path: POSTGRES_USER
                            -   key: password
                                path: POSTGRES_PASSWORD
                            -   key: database
                                path: POSTGRES_DATABASE
                    -   secret:
                            name: '{{ .Values.SERVICE_NAME }}-encryption-secret'
                            items:
                            -   key: sym-key
                                path: SYM_KEY
                            -   key: default-key
                                path: KS_DEFAULT_KEY
        {{- if $tlsEnabled }}
              - name: tls
                secret:
                    secretName: '{{ .Values.SERVICE_NAME }}-tls'
        {{- end }}
        {{- if $readOnly }}
              - name: tmp
                emptyDir: {}
              - name: env
                emptyDir: {}
              - name: ncdiag
                emptyDir: {}
              - name: glowroot
                emptyDir: {}
              - name: nss
                emptyDir: {}
              - name: java-certs
                emptyDir: {}
              - name: secret
                emptyDir: {}
        {{- end }}
        {{- if .Values.priorityClassName }}
            priorityClassName: {{ .Values.priorityClassName }}
        {{- end }}
            containers:
            -   name: '{{ .Values.SERVICE_NAME }}'
                image: '{{ .Values.IMAGE_REPOSITORY }}:{{ .Values.TAG }}'
                volumeMounts:
                -   name: dbaas-security-volume
                    mountPath: '{{ .Values.DBAAS_SECURITY_CONFIGURATION_LOCATION }}'
                    readOnly: true
                -   name: dbaas-global-permissions-configuration-volume
                    mountPath: '{{ .Values.DBAAS_GLOBAL_PERMISSIONS_CONFIGURATION_LOCATION }}'
                    readOnly: true
            {{- if $tlsEnabled }}
                -   name: tls
                    mountPath: '/etc/tls'
                    readOnly: true
            {{- end }}
                -   name: pod-secrets
                    mountPath: /etc/secrets/pod-secrets
                    readOnly: true
            {{ if $readOnly }}
                -   name: tmp
                    mountPath: /tmp
                -   name: env
                    mountPath: /etc/env
                -   name: ncdiag
                    mountPath: /app/ncdiag
                -   name: glowroot
                    mountPath: /app/glowroot
                -   name: nss
                    mountPath: /app/nss
                -   name: java-certs
                    mountPath: /etc/ssl/certs/java
                -   name: secret
                    mountPath: /etc/secret
            {{ end }}
                args:
                - /usr/bin/java
                - '{{ .Values.MEM_ARGS }}'
                {{- if $tlsEnabled }}
                - -Dquarkus.profile=tls
                {{- end }}
                - --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
                - -jar
                - /app/dbaas-aggregator.jar
                ports:
                -   name: web
                    containerPort: 8080
                    protocol: TCP
                {{- if $tlsEnabled }}
                -   name: tls
                    containerPort: 8443
                    protocol: TCP
                {{- end }}
                env:
                -   name : "DBAAS_SECURITY_CONFIGURATION_SECRET_SHA1SUM"
                    value: {{ $sha1sum }}
                -   name: DBAAS_SECURITY_CONFIGURATION_LOCATION
                    value: '{{ .Values.DBAAS_SECURITY_CONFIGURATION_LOCATION }}'
                -   name: DBAAS_PREMATURE_REGISTRATION_ADAPTER_ADDRESSES
                    value: '{{ .Values.DBAAS_PREMATURE_REGISTRATION_ADAPTER_ADDRESSES }}'
                -   name: DBAAS_DEFAULT_PHYSICAL_DATABASES_DISABLED
                    value: '{{ .Values.DBAAS_DEFAULT_PHYSICAL_DATABASES_DISABLED }}'
                -   name: CLOUD_NAMESPACE
                    valueFrom:
                        fieldRef:
                            fieldPath: 'metadata.namespace'
                -   name: INTERNAL_TLS_ENABLED
                    value: '{{ .Values.INTERNAL_TLS_ENABLED }}'
                {{- if $tlsEnabled }}
                -   name: CERTIFICATE_FILE_PASSWORD
                    valueFrom:
                        secretKeyRef:
                            name: 'tls-password-secret'
                            key: 'tls-password'
                -   name: CERTIFICATE_FILE_PATH
                    value: '/etc/tls'
                {{- end }}
                -   name: MICROSERVICE_NAME
                    value: '{{ .Values.SERVICE_NAME }}'
                -   name: POSTGRES_HOST
                    value: '{{ .Values.POSTGRES_HOST }}'
                -   name: POSTGRES_PORT
                    value: '{{ .Values.POSTGRES_PORT }}'
                -   name: CLOUD_PUBLIC_HOST
                    value: '{{ .Values.CLOUD_PUBLIC_HOST }}'
                -   name: PRODUCTION_MODE
                    value: '{{ .Values.PRODUCTION_MODE }}'
                -   name: EXECUTION_MODE
                    value: "{{ .Values.EXECUTION_MODE }}"
                -   name: NC_DIAGNOSTIC_MODE
                    value: '{{ .Values.NC_DIAGNOSTIC_MODE }}'
                -   name: NC_DIAGNOSTIC_AGENT_SERVICE
                    value: '{{ .Values.NC_DIAGNOSTIC_AGENT_SERVICE }}'
                -   name: DISABLE_DEPRECATED_API
                    value: '{{ .Values.DISABLE_DEPRECATED_API }}'
                -   name: DBAAS_LOG_LEVEL
                    value: '{{ .Values.DBAAS_LOG_LEVEL }}'
              {{- if .Values.DBAAS_BACKUP_RESTORE_CHECK_LOCK_TIMEOUT }}
                -   name: DBAAS_BACKUP_RESTORE_CHECK_LOCK_TIMEOUT
                    value: '{{ .Values.DBAAS_BACKUP_RESTORE_CHECK_LOCK_TIMEOUT }}'
              {{- end }}
              {{- if .Values.DBAAS_BACKUP_RESTORE_CHECK_INTERVAL }}
                -   name: DBAAS_BACKUP_RESTORE_CHECK_INTERVAL
                    value: '{{ .Values.DBAAS_BACKUP_RESTORE_CHECK_INTERVAL }}'
              {{- end }}
              {{- if .Values.DBAAS_BACKUP_RESTORE_CHECK_ATTEMPTS }}
                -   name: DBAAS_BACKUP_RESTORE_CHECK_ATTEMPTS
                    value: '{{ .Values.DBAAS_BACKUP_RESTORE_CHECK_ATTEMPTS }}'
              {{- end }}
              {{- if .Values.DBAAS_BACKUP_RESTORE_RETRY_DELAY_SECONDS }}
                -   name: DBAAS_BACKUP_RESTORE_RETRY_DELAY_SECONDS
                    value: '{{ .Values.DBAAS_BACKUP_RESTORE_RETRY_DELAY_SECONDS }}'
              {{- end }}
              {{- if .Values.DBAAS_BACKUP_RESTORE_RETRY_ATTEMPTS }}
                -   name: DBAAS_BACKUP_RESTORE_RETRY_ATTEMPTS
                    value: '{{ .Values.DBAAS_BACKUP_RESTORE_RETRY_ATTEMPTS }}'
              {{- end }}
                -   name: DBAAS_SECURITY_NAMESPACE_ISOLATION_ENABLED
                    value: '{{ .Values.DBAAS_SECURITY_NAMESPACE_ISOLATION_ENABLED }}'
                -   name: M2M_AUTH_MODE
                    value: '{{ .Values.M2M_AUTH_MODE }}'
              {{- if .Values.KUBERNETES_M2M_AUDIENCE }}
                -   name: KUBERNETES_M2M_AUDIENCE
                    value: '{{ .Values.KUBERNETES_M2M_AUDIENCE }}'
              {{- end }}
                resources:
                    requests:
                        cpu: '{{ .Values.CPU_REQUEST }}'
                        memory: '{{ .Values.MEMORY_LIMIT }}'
                    limits:
                        memory: '{{ .Values.MEMORY_LIMIT }}'
                        cpu: '{{ .Values.CPU_LIMIT }}'
                livenessProbe:
                    httpGet:
                        path: /probes/live
                        port: {{ if $tlsEnabled }} tls {{ else }} web {{ end }}
                        scheme: {{ if $tlsEnabled }} HTTPS {{ else }} HTTP {{ end }}
                    initialDelaySeconds: {{ .Values.LIVENESS_PROBE_INITIAL_DELAY_SECONDS }}
                    timeoutSeconds: 15
                readinessProbe:
                    httpGet:
                        path: /probes/ready
                        port: {{ if $tlsEnabled }} tls {{ else }} web {{ end }}
                        scheme: {{ if $tlsEnabled }} HTTPS {{ else }} HTTP {{ end }}
                    initialDelaySeconds: 30
                    timeoutSeconds: 15
                securityContext:
                    readOnlyRootFilesystem: {{ $readOnly }}
                    runAsNonRoot: true
                {{ if eq .Values.PAAS_PLATFORM "KUBERNETES" }}
                    runAsUser: 10001
                    runAsGroup: 10001
                {{ end }}
                    seccompProfile:
                        type: RuntimeDefault
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                          - ALL
            topologySpreadConstraints:
{{- if .Values.CLOUD_TOPOLOGIES }}
{{- range $v := .Values.CLOUD_TOPOLOGIES }}
            - topologyKey: {{ $v.topologyKey }}
              maxSkew: {{ $v.maxSkew | default 1 }}
              whenUnsatisfiable: {{ $v.whenUnsatisfiable | default "ScheduleAnyway" }}
              labelSelector:
                matchLabels:
                  name: "{{ .Values.SERVICE_NAME }}"
{{- end }}
{{- else }}
            -   maxSkew: 1
                topologyKey: "{{ .Values.CLOUD_TOPOLOGY_KEY }}"
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                    matchLabels:
                        name: "{{ .Values.SERVICE_NAME }}"
{{- end }}
    selector:
        matchLabels:
            name: '{{ .Values.SERVICE_NAME }}'
