---
apiVersion: batch/v1
kind: Job
metadata:
  name: validation-hook-{{ .Values.SERVICE_NAME }}
  annotations:
    helm.sh/hook: "pre-install, pre-upgrade"
    helm.sh/hook-weight: "-200"
    helm.sh/hook-delete-policy: "before-hook-creation, hook-succeeded"
  labels:
    {{- include "dbaas.basicLabels" . | nindent 4 }}
spec:
  backoffLimit: 5
  template:
    metadata:
      name: validation-hook-{{ .Values.SERVICE_NAME }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: validation-hook-{{ .Values.SERVICE_NAME }}
          image: {{ include "dbaas.hookImage" . }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: {{ .Values.SERVICE_NAME }}-env-variables
          resources:
            requests:
              cpu: '100m'
              memory: '50Mi'
            limits:
              cpu: '100m'
              memory: '50Mi'
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Never
