---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.SERVICE_NAME }}-pre-hook
  annotations:
    helm.sh/hook: "pre-install,pre-upgrade"
    helm.sh/hook-weight: "-100"
    helm.sh/hook-delete-policy: "before-hook-creation, hook-succeeded"
  labels:
    {{- include "dbaas.basicLabels" . | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      name: {{ .Values.SERVICE_NAME }}-pre-hook
    spec:
      serviceAccountName: '{{ .Values.SERVICE_NAME }}-sa'
      terminationGracePeriodSeconds: 10
      containers:
        - name: "{{ .Values.SERVICE_NAME }}-validation"
          image: "{{ include "dbaas.hookImage" . }}"
          command: [ "/prepare-database.sh" ]
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: {{ .Values.SERVICE_NAME }}-env-variables
          resources:
            requests:
              cpu: '100m'
              memory: '50Mi'
            limits:
              cpu: '100m'
              memory: '50Mi'
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Never
