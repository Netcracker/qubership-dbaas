{{ if eq (.Values.MONITORING_ENABLED | toString | lower) "true" }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: '{{ .Values.SERVICE_NAME }}.monitoring-config'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    deployment.netcracker.com/sessionId: {{ .Values.DEPLOYMENT_SESSION_ID | default "unimplemented" }}
data:
  url.health: {{ if eq (.Values.INTERNAL_TLS_ENABLED | toString | lower) "true" }} https://%(ip)s:8443/health {{ else }} http://%(ip)s:8080/health {{ end }}
  url.metrics: {{ if eq (.Values.INTERNAL_TLS_ENABLED | toString | lower) "true" }} https://%(ip)s:8443/metrics {{ else }} http://%(ip)s:8080/metrics {{ end }}
  prometheus.url.metrics: {{ if eq (.Values.INTERNAL_TLS_ENABLED | toString | lower) "true" }} https://%(ip)s:8443/prometheus {{ else }} http://%(ip)s:8080/prometheus {{ end }}
  group.metrics.counter.status.all: ^counter.status..+
  group.metrics.gauge.response.all: ^gauge.response..+
{{ end }}
