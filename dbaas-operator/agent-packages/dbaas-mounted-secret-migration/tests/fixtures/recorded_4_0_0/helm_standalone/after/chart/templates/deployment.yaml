apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: '{{ .Values.NAMESPACE }}'
spec:
  replicas: {{ .Values.replicaCount }}
  template:
    spec:
      containers:
        - name: orders
          image: orders:latest
          volumeMounts:
            {{- if .Capabilities.APIVersions.Has "dbaas.netcracker.com/v1" }}
            - name: orders-postgresql-service-default-secret
              mountPath: /etc/secrets/dbaas-secrets/orders-postgresql-service-default-credentials
              readOnly: true
            {{- end }}
          # keep this comment exactly where it is
      volumes:
        - name: config
          configMap:
            name: orders-config
        {{- if .Capabilities.APIVersions.Has "dbaas.netcracker.com/v1" }}
        - name: orders-postgresql-service-default-secret
          secret:
            secretName: orders-postgresql-service-default-credentials
        {{- end }}
