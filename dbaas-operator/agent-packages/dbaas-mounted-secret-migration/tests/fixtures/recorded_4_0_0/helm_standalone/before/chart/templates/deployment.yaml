apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: '{{ .Values.NAMESPACE }}'
spec:
  replicas: {{ .Values.replicaCount }}
  template:
    spec:
      containers:
        - name: orders
          image: orders:latest
          # keep this comment exactly where it is
      volumes:
        - name: config
          configMap:
            name: orders-config
