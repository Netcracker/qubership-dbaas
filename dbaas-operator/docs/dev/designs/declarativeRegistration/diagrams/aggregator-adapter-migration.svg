 width="143.876" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="692.002" y="98.292" fill="#000" font-size="14" textLength="129.876">DBaaS Aggregator</text><text x="1066.878" y="106.292" fill="#000" font-size="14" textLength="108.821">DBaaS Registry</text><path d="M1106.289,57.297 C1106.289,47.297 1124.289,47.297 1124.289,47.297 C1124.289,47.297 1142.289,47.297 1142.289,57.297 L1142.289,83.297 C1142.289,93.297 1124.289,93.297 1124.289,93.297 C1124.289,93.297 1106.289,93.297 1106.289,83.297 L1106.289,57.297" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1106.289,57.297 C1106.289,67.297 1124.289,67.297 1124.289,67.297 C1124.289,67.297 1142.289,67.297 1142.289,57.297" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="10" y="885.789" width="120.668" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="905.784" fill="#000" font-size="14" textLength="106.668">DBaaS Adapter</text><rect x="685.002" y="885.789" width="143.876" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="692.002" y="905.784" fill="#000" font-size="14" textLength="129.876">DBaaS Aggregator</text><text x="1066.878" y="898.784" fill="#000" font-size="14" textLength="108.821">DBaaS Registry</text><path d="M1106.289,912.086 C1106.289,902.086 1124.289,902.086 1124.289,902.086 C1124.289,902.086 1142.289,902.086 1142.289,912.086 L1142.289,938.086 C1142.289,948.086 1124.289,948.086 1124.289,948.086 C1124.289,948.086 1106.289,948.086 1106.289,938.086 L1106.289,912.086" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1106.289,912.086 C1106.289,922.086 1124.289,922.086 1124.289,922.086 C1124.289,922.086 1142.289,922.086 1142.289,912.086" style="stroke:#181818;stroke-width:0.5;" fill="none"/><path d="M9.198,122.594 L9.198,162.594 L817.198,162.594 L817.198,132.594 L807.198,122.594 L9.198,122.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M807.198,122.594 L807.198,132.594 L817.198,132.594 L807.198,122.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="193.764" y="139.661" fill="#000" font-size="13" textLength="430.746">Starts when physical database registration answers 202 Accepted</text><text x="193.764" y="154.793" fill="#000" font-size="13" textLength="348.321">with the first portion of logical databases (up to 100).</text><path d="M16.334,171.859 L92.958,171.859 L92.958,178.992 L82.958,188.992 L16.334,188.992 L16.334,171.859" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="16.334" y="171.859" width="1217.603" height="689.93" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="31.334" y="184.926" fill="#000" font-size="13" textLength="31.624" font-weight="700">loop</text><text x="107.958" y="184.07" fill="#000" font-size="11" textLength="260.89" font-weight="700">[while Aggregator answers 202 Accepted]</text><line x1="70.334" y1="235.258" x2="112.334" y2="235.258" style="stroke:#181818;stroke-width:1;"/><line x1="112.334" y1="235.258" x2="112.334" y2="248.258" style="stroke:#181818;stroke-width:1;"/><line x1="71.334" y1="248.258" x2="112.334" y2="248.258" style="stroke:#181818;stroke-width:1;"/><polygon points="81.334,244.258,71.334,248.258,81.334,252.258,77.334,248.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="77.334" y="215.059" fill="#000" font-size="13" textLength="169.635">create users for new roles</text><text x="77.334" y="230.192" fill="#000" font-size="13" textLength="222.028">in logical databases of the portion</text><polygon points="744.94,303.656,754.94,307.656,744.94,311.656,748.94,307.656" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="70.334" y1="307.656" x2="750.94" y2="307.656" style="stroke:#181818;stroke-width:1;"/><text x="77.334" y="272.325" fill="#000" font-size="13" textLength="131.771">report portion result</text><text x="77.334" y="287.458" fill="#000" font-size="13" textLength="662.606">POST /api/v3/dbaas/{type}/physical_databases/{phydbid}/instruction/{instructionId}/additional-roles</text><text x="77.334" y="302.59" fill="#000" font-size="13" textLength="306.497">(connection properties of new users, or failure)</text><path d="M740.94,319.656 L810.392,319.656 L810.392,326.789 L800.392,336.789 L740.94,336.789 L740.94,319.656" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="740.94" y="319.656" width="399.349" height="71.398" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="755.94" y="332.723" fill="#000" font-size="13" textLength="24.451" font-weight="700">opt</text><text x="825.392" y="331.867" fill="#000" font-size="11" textLength="147.684" font-weight="700">[adapter created users]</text><polygon points="1112.289,379.055,1122.289,383.055,1112.289,387.055,1116.289,383.055" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="756.94" y1="383.055" x2="1118.289" y2="383.055" style="stroke:#181818;stroke-width:1;"/><text x="763.94" y="362.856" fill="#000" font-size="13" textLength="311.073">save connection properties of logical databases</text><text x="763.94" y="377.989" fill="#000" font-size="13" textLength="275.583">and remove them from the migration plan</text><path d="M35.334,409.055 L99.777,409.055 L99.777,416.188 L89.777,426.188 L35.334,426.188 L35.334,409.055" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="35.334" y="409.055" width="1173.603" height="438.734" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="50.334" y="422.122" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="114.777" y="421.265" fill="#000" font-size="11" textLength="294.696" font-weight="700">[adapter reports failure, or saving results fails]</text><polygon points="1112.289,453.32,1122.289,457.32,1112.289,461.32,1116.289,457.32" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="756.94" y1="457.32" x2="1118.289" y2="457.32" style="stroke:#181818;stroke-width:1;"/><text x="763.94" y="452.254" fill="#000" font-size="13" textLength="140.029">delete migration plan</text><polygon points="81.334,497.586,71.334,501.586,81.334,505.586,77.334,501.586" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="75.334" y1="501.586" x2="755.94" y2="501.586" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="87.334" y="481.387" fill="#000" font-size="13" textLength="394.824">500 Internal Server Error (no error code): migration aborted,</text><text x="87.334" y="496.52" fill="#000" font-size="13" textLength="183.301">restarts on next registration</text><line x1="35.334" y1="510.586" x2="1208.937" y2="510.586" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="40.334" y="522.796" fill="#000" font-size="11" textLength="238.912" font-weight="700">[portion is processed without failures]</text><path d="M54.334,532.391 L118.777,532.391 L118.777,539.523 L108.777,549.523 L54.334,549.523 L54.334,532.391" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="54.334" y="532.391" width="1129.603" height="301.398" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="69.334" y="545.458" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="133.777" y="544.601" fill="#000" font-size="11" textLength="236.14" font-weight="700">[logical databases remain in the plan]</text><polygon points="81.334,576.656,71.334,580.656,81.334,584.656,77.334,580.656" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="75.334" y1="580.656" x2="755.94" y2="580.656" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="87.334" y="575.59" fill="#000" font-size="13" textLength="311.981">202 Accepted: next portion of logical databases</text><line x1="54.334" y1="589.656" x2="1183.937" y2="589.656" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="59.334" y="601.867" fill="#000" font-size="11" textLength="221.708" font-weight="700">[all logical databases are migrated]</text><polygon points="1112.289,654.859,1122.289,658.859,1112.289,662.859,1116.289,658.859" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="756.94" y1="658.859" x2="1118.289" y2="658.859" style="stroke:#181818;stroke-width:1;"/><text x="763.94" y="623.528" fill="#000" font-size="13" textLength="248.352">apply the parked registration request:</text><text x="763.94" y="638.661" fill="#000" font-size="13" textLength="306.033">save new supported roles of physical database</text><text x="763.94" y="653.793" fill="#000" font-size="13" textLength="168.619">and delete migration plan</text><line x1="756.94" y1="687.992" x2="798.94" y2="687.992" style="stroke:#181818;stroke-width:1;"/><line x1="798.94" y1="687.992" x2="798.94" y2="700.992" style="stroke:#181818;stroke-width:1;"/><line x1="757.94" y1="700.992" x2="798.94" y2="700.992" style="stroke:#181818;stroke-width:1;"/><polygon points="767.94,696.992,757.94,700.992,767.94,704.992,763.94,700.992" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="763.94" y="682.926" fill="#000" font-size="13" textLength="353.349">reset the adapter client and physical database caches</text><path d="M761.94,713.992 L761.94,798.992 L1161.94,798.992 L1161.94,723.992 L1151.94,713.992 L761.94,713.992" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1151.94,713.992 L1151.94,723.992 L1161.94,723.992 L1151.94,713.992" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="767.94" y="731.059" fill="#000" font-size="13" textLength="354.599">The physical database enters the new state only here.</text><text x="767.94" y="746.192" fill="#000" font-size="13" textLength="320.055">Until this step it keeps the old set of roles, so the</text><text x="767.94" y="761.325" fill="#000" font-size="13" textLength="364.939">aggregator never hands out a role that is not yet stored</text><text x="767.94" y="776.458" fill="#000" font-size="13" textLength="379.996">in the DBaaS Registry. After the cache reset, requests use</text><text x="767.94" y="791.59" fill="#000" font-size="13" textLength="311.676">the new roles, adapter address and credentials.</text><polygon points="81.334,821.789,71.334,825.789,81.334,829.789,77.334,825.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="75.334" y1="825.789" x2="755.94" y2="825.789" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="87.334" y="820.723" fill="#000" font-size="13" textLength="192.061">200 OK: migration completed</text><g class="legend" data-source-line="41"><rect x="765.302" y="965.086" width="469.635" height="58.891" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="770.302" y="983.081" fill="#000" font-size="14" textLength="418.763">Solid arrow: synchronous request. Dashed arrow: response.</text><text x="770.302" y="999.378" fill="#000" font-size="14" textLength="459.635">Each loop iteration is a separate request initiated by the adapter.</text><text x="770.302" y="1015.675" fill="#000" font-size="14" textLength="328.979">Registry write acknowledgements are omitted.</text></g><?plantuml-src XLN1Rjim3BtxAuYUMY1jiWsxv32WGtSOTjYmRhS00sCnjb15qYIvML3itqTAbfiqRLS4XMrHr7kFZrJIoH1SAwMJTXOD16SembPt0ULBqtWCIRVQeqrmTlCHyPR3qISAPu2nFZyRrdM1EankZ9nU6uK9rnYfHdwdJiSKzZcklZIDTOd0tLEefymEam3S9Zuqmgud2xxVHzqoWIbtA7ao3K0RTnGYl5syXUks9SwcECDEfnvIJx3H8IRmBkHejm7ZkgDq4Su73yd1cyNYugeXgq3WDOrnpZC4BJ9Eu5uwR-G1bn_gunBQGCWyXoZn6zvhQLVAiBBQFWE4qGda4UoJh1E49GiW8HEfG74mQMM_VRtz0NFqUdx_RgxMY77-aFQU_iwhXh-ci-OF_4sjjVexrvR575f9DNyuUFdCQpZvvt84VjuwQoa7