412,132.2188 L422,132.2188 L412,122.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.2959" x="72" y="140.7139">Started by the registration process. The physical database</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.5615" x="72" y="157.0654">row keeps its old values until completion.</text><g class="message" data-participant-1="Aggregator" data-participant-2="Registry"><polygon fill="#181818" points="590.8521,207.625,600.8521,211.625,590.8521,215.625,594.8521,211.625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="244.2544" x2="596.8521" y1="211.625" y2="211.625"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.918" x="251.2544" y="190.417">acquire the keep-alive lock</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.1079" x="251.2544" y="206.7686">roles-migration-{phydbid}-{type}</text></g><path d="M607,174.9219 L607,216.9219 L854,216.9219 L854,184.9219 L844,174.9219 L607,174.9219" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M844,174.9219 L844,184.9219 L854,184.9219 L844,174.9219" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="613" y="193.417">while the lock is held, every registration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.686" x="613" y="209.7686">of this physical database answers 202</text><path d="M117,229.625 L189.4346,229.625 L189.4346,237.9766 L179.4346,247.9766 L117,247.9766 L117,229.625" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="494.0313" style="stroke:#000000;stroke-width:1.5;" width="665.8066" x="117" y="229.625"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="27.4346" x="132" y="244.1201">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="264.709" x="204.4346" y="243.0439">[while a logical database still lacks a required role]</text><g class="message" data-participant-1="Aggregator" data-participant-2="Registry"><polygon fill="#181818" points="590.8521,282.6797,600.8521,286.6797,590.8521,290.6797,594.8521,286.6797" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="244.2544" x2="596.8521" y1="286.6797" y2="286.6797"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4561" x="251.2544" y="265.4717">next portion of logical databases</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.4897" x="251.2544" y="281.8232">missing at least one required role</text></g><path d="M158.4961,301.6797 L230.9307,301.6797 L230.9307,310.0313 L220.9307,320.0313 L158.4961,320.0313 L158.4961,301.6797" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="203.8125" style="stroke:#000000;stroke-width:1.5;" width="614.3105" x="158.4961" y="301.6797"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="27.4346" x="173.4961" y="316.1748">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="113.0884" x="245.9307" y="315.0986">[per logical database]</text><g class="message" data-participant-1="Aggregator" data-participant-2="Aggregator"><line style="stroke:#181818;stroke-width:1;" x1="244.2544" x2="286.2544" y1="358.7344" y2="358.7344"/><line style="stroke:#181818;stroke-width:1;" x1="286.2544" x2="286.2544" y1="358.7344" y2="371.7344"/><li