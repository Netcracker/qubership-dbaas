44,490.4922,255.2544,494.4922,251.2544,490.4922" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="249.2544" x2="696.1655" y1="490.4922" y2="490.4922"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.2134" x="261.2544" y="469.2842">201: connection properties</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.3799" x="261.2544" y="485.6357">and resources</text></g><path d="M127,519.4922 L187.1709,519.4922 L187.1709,527.8438 L177.1709,537.8438 L127,537.8438 L127,519.4922" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="134.1094" style="stroke:#000000;stroke-width:1.5;" width="514.5244" x="127" y="519.4922"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.1709" x="142" y="533.9873">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="117.3691" x="202.1709" y="532.9111">[a user creation failed]</text><g class="message" data-participant-1="Aggregator" data-participant-2="Registry"><polygon fill="#181818" points="590.8521,572.5469,600.8521,576.5469,590.8521,580.5469,594.8521,576.5469" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="244.2544" x2="596.8521" y1="576.5469" y2="576.5469"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.6035" x="251.2544" y="555.3389">store the failure</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.127" x="251.2544" y="571.6904">(database id, message) in the instruction</text></g><path d="M137,589.5469 L137,648.5469 L350,648.5469 L350,599.5469 L340,589.5469 L137,589.5469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M340,589.5469 L340,599.5469 L350,599.5469 L340,589.5469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.4453" x="143" y="608.042">the migration stops;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.9307" x="143" y="624.3936">the failure stays in the instruction,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.2808" x="143" y="640.7451">the lock is released</text><g class="message" data-participant-1="Aggregator" data-participant-2="Registry"><polygon fill="#181818" points="590.8521,711.6563,600.8521,715.6563,590.8521,719.6563,594.8521,715.6563" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="244.2544" x2="596.8521" y1="715.6563" y2="715.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.5977" x="251.2544" y="678.0967">save the connection properties of the migrated databases,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.5068" x="251.2544" y="694.4482">drop the stored failures of the migrated databases,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.0044" x="251.2544" y="710.7998">save the instruction</text></g><path d="M168.4961,737.6563 L310.6978,737.6563 L310.6978,746.0078 L300.6978,756.0078 L168.4961,756.0078 L168.4961,737.6563" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="124.7578" style="stroke:#000000;stroke-width:1.5;" width="473.0283" x="168.4961" y="737.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.2017" x="183.4961" y="752.1514">@Transactional</text><g class="message" data-participant-1="Aggregator" data-participant-2="Registry">