,904.7656 L5,904.7656" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M339,904.7656 L339,914.7656 L349,914.7656 L339,904.7656" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.0068" x="11" y="923.2607">The operator learns the outcome on its next registration:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.1123" x="11" y="939.6123">lock held - 202; stored failures of a previous run - 500</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.6333" x="11" y="955.9639">(and the migration restarts); after completion - 200.</text><!--SRC=[VLN1Rjim3BtxAuYUMY1fqc2xfDYm3SE0NRPXxMwvC1Rh254aLPJJPKN_VPGSEqxZz1975lduI3xIKKT3yDr62XOD12UdZQu2HkriKV1QMuy1Dy3qM9CjwPkpyKx_8xXvLnHo5NMfFTe85r-_8Dx1Jq_YxC8587U78SFFLHMewamFnq9Xn2KomSLlgZJ7iCiMxM4GJA6N51gavdzHM1S9t9P27npWBee_ALZk8Au8GWER4mOVN4dCrt0lDtwrOrrALLf2uXpS4wo9F8EE3CuesAAfYQ6sKHietSORIb3N1La5YK9H7CB3-6ENnnomVAnre4mZWOxHw2s1SULwOLChUDprOlmiTDHIgvVnSznvUcdI2xfQnJayhRHfS98pQ8OL6JK2akntHoakh7iGGx4uIG_GyXC5XjbqLXJ6ER_7HK6jZarPiZLWi5opN0VAYQYi7wdIkOGj_OtWNSYr5XwlONbXDvfPsmemWY7a2CxI2Nxc9jew0P2xrz4Ffpaay3qAmmUfSOix1leh72LmHkZmUmxvuWIyqTeSVlsvXsTKAeXwNYRezMGxcwWb8a-miPaqRPlKB2LUs4kr_84R6cNignQyCONnAzwpwSrSj6KjbQrCXLtKgM0eCfEehWwYt8mZmYkQNtcWYTAW51JAG8tA7r2wgWPgTUWKovj6KCcu3fGOjytNegoD98eLNO6ssKnRSQmplGmyD7ppRDb9EWNnVBkmlJ3o3dSy03fgp5fv1qhge5wYPpF1RPF8OFqWJqDBIbhTIL42AZ7BjxaQgkNujbCNhr-HpB4AhlRmwJx8d65-Z-ODukYzQLQKBBnrKc5_KoNf4iV4KaeHQQ09v-T0Sg2OFVRYbD5N2tkw4KeiLwAgHFySpNqdkkNJtxlj_XyTR-2qNDt-Aarvi9pTNHrbWShJvksQjqK_wNaUVH50McuoixAdReTwWz9WscfNYqvgAuRlfrDnlKoZSgn0SKXV0xww1Nn8TJWiy8m_FQpn_m00]--></g></svg>