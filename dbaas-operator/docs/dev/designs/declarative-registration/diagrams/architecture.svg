ont-size="13" lengthAdjust="spacing" textLength="238.4561" x="1725.5" y="438.0176">the descriptor and the user-creation calls.</text></g><!--link ns_adapter to ns_dbaas--><!--link Operator to CR--><g class="link" data-entity-1="Operator" data-entity-2="CR" data-source-line="23" data-uid="lnk13" id="link_Operator_CR"><path d="M418.66,241.2094 C542.56,210.7494 831.03,144.3294 1078,121.3194 C1098.8,119.3794 1106.38,111.8594 1125,121.3194 C1173.45,145.9194 1201.5485,201.0483 1214.4785,232.1783" fill="none" id="Operator-to-CR" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1216.78,237.7194,1217.0218,227.8735,1214.8621,233.1018,1209.6337,230.9421,1216.78,237.7194" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.6899" x="1046.5" y="85.8145">watches</text></g><!--link Operator to Secret--><g class="link" data-entity-1="Operator" data-entity-2="Secret" data-source-line="24" data-uid="lnk14" id="link_Operator_Secret"><path d="M418.54,258.9794 C514.99,261.8394 696.33,271.7194 750,305.8194 C772.59,320.1694 759.26,342.7194 782,356.8194 C866.75,409.3794 1157.35,415.7654 1292.27,415.8554" fill="none" id="Operator-to-Secret" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1298.27,415.8594,1289.27,411.8594,1293.27,415.8594,1289.27,419.8594,1298.27,415.8594" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.6289" x="783" y="336.8145">reads on every reconcile</text></g><!--link RBAC to Secret--><g class="link" data-entity-1="RBAC" data-entity-2="Secret" data-source-line="26" data-uid="lnk15" id="link_RBAC_Secret"><path d="M1566.06,276.0794 C1552.29,297.7794 1526.78,333.9194 1497,356.8194 C1474.49,374.1294 1451.6362,385.4298 1427.0162,395.0798" fill="none" id="RBAC-to-Secret" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" 