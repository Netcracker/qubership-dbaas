-serif" font-size="13" lengthAdjust="spacing" textLength="111.2871" x="858.364" y="69.3145">200: the descriptor:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.146" x="790.4346" y="85.6661">physicalDatabaseId, type, supportedRoles,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.0151" x="789" y="102.0176">features, labels, readOnlyHost, apiVersions</text></g><!--link Operator to Aggregator--><g class="link" data-entity-1="Operator" data-entity-2="Aggregator" data-source-line="36" data-uid="lnk21" id="link_Operator_Aggregator"><path d="M295.22,274.8894 C293.8,275.2094 292.39,275.5194 291,275.8194 C249.42,284.7594 129.61,273.4794 102,305.8194 C87.28,323.0594 87.07,339.7594 102,356.8194 C125.87,384.0994 347.244,402.5704 464.624,410.5904" fill="none" id="Operator-to-Aggregator" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="470.61,410.9994,461.9036,406.3952,465.6216,410.6585,461.3583,414.3766,470.61,410.9994" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="43.3481" x="241.0488" y="320.3145">register</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.4458" x="103" y="336.6661">PUT /api/v3/dbaas/{type}/physical_databases/{phydbid}</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.3262" x="196.0598" y="353.0176">?internalMigration=true</text></g><!--link Aggregator to Operator--><g class="link" data-entity-1="Aggregator" data-entity-2="Operator" data-source-line="37" data-uid="lnk22" id="link_Aggregator_Operator"><path d="M511.96,397.1594 C496.58,386.4494 477.69,372.0394 463,356.8194 C443.73,336.8594 446.75,325.2994 427,305.8194 C415.57,294.5394 406.2282,287.4021 393.4782,279.2121" fill="none" id="Aggregator-to-Operator" style="stroke:#18