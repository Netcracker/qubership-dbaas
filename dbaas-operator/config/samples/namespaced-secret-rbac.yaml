# Per-business-namespace Secret RBAC for the dbaas-operator.
#
# The operator has no cluster-wide Secret permissions. A namespace that contains
# ExternalDatabase or DatabaseSecretClaim resources must grant the operator's
# ServiceAccount access with the Role and RoleBinding below.
#
# Replace:
#   <business-namespace>  namespace containing the managed CRs
#   <operator-namespace>  CLOUD_NAMESPACE and the value used by spec.operatorNamespace
#   <operator-sa>         operator ServiceAccount name (default: dbaas-operator)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dbaas-operator-secrets
  namespace: <business-namespace>
rules:
  - apiGroups: [ "" ]
    resources: [ secrets ]
    verbs: [ get, create, update, patch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbaas-operator-secrets
  namespace: <business-namespace>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dbaas-operator-secrets
subjects:
  - kind: ServiceAccount
    name: <operator-sa>
    namespace: <operator-namespace>
