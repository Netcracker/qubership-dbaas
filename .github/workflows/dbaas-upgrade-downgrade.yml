name: DBaaS Upgrade/Downgrade Availability

run-name: >
  DBaaS aggregator ${{ github.event.inputs.direction }}
  ${{ github.event.inputs.older-version }} <-> ${{ github.event.inputs.newer-version }}

# Each direction runs in a separate Kind cluster with the operator fixed at the newer version.
# Job-level concurrency lets upgrade and downgrade run in parallel while serializing repeated runs.

on:
  workflow_dispatch:
    inputs:
      older-version:
        description: 'Older dbaas-aggregator version (no leading "v"), e.g. 6.14.1'
        required: true
        default: '6.14.1'
        type: string
      newer-version:
        description: 'Newer dbaas-aggregator version (no leading "v"), e.g. 6.15.0'
        required: true
        default: '6.15.0'
        type: string
      direction:
        description: Which direction(s) to run
        required: true
        default: both
        type: choice
        options:
          - both
          - upgrade
          - downgrade

permissions: {}

jobs:
  upgrade:
    name: Upgrade ${{ github.event.inputs.older-version }} -> ${{ github.event.inputs.newer-version }}
    if: ${{ github.event.inputs.direction == 'both' || github.event.inputs.direction == 'upgrade' }}
    permissions:
      contents: read
    uses: ./.github/workflows/dbaas-transition-worker.yml
    with:
      direction: upgrade
      initial-version: ${{ github.event.inputs.older-version }}
      target-version: ${{ github.event.inputs.newer-version }}
      fixture-version: ${{ github.event.inputs.newer-version }}

  downgrade:
    name: Downgrade ${{ github.event.inputs.newer-version }} -> ${{ github.event.inputs.older-version }}
    if: ${{ github.event.inputs.direction == 'both' || github.event.inputs.direction == 'downgrade' }}
    permissions:
      contents: read
    uses: ./.github/workflows/dbaas-transition-worker.yml
    with:
      direction: downgrade
      initial-version: ${{ github.event.inputs.newer-version }}
      target-version: ${{ github.event.inputs.older-version }}
      fixture-version: ${{ github.event.inputs.newer-version }}

  # Keep one branch-protection check name for all direction selections.
  gate:
    name: DBaaS Upgrade/Downgrade Gate
    if: always()
    needs: [upgrade, downgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check selected direction(s) succeeded
        run: |
          set -euo pipefail
          upgrade_result="${{ needs.upgrade.result }}"
          downgrade_result="${{ needs.downgrade.result }}"
          echo "upgrade: $upgrade_result"
          echo "downgrade: $downgrade_result"
          fail=0
          for result in "$upgrade_result" "$downgrade_result"; do
            case "$result" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::At least one selected transition direction did not succeed"
            exit 1
          fi
          echo "All selected transition directions succeeded"
