name: DBaaS Transition Worker

on:
  workflow_call:
    inputs:
      direction:
        description: Which transition this run performs (upgrade or downgrade).
        required: true
        type: string
      initial-version:
        description: dbaas-aggregator version the environment starts on (e.g. 6.14.1, no leading "v").
        required: true
        type: string
      target-version:
        description: dbaas-aggregator version the Helm release is transitioned to (e.g. 6.15.0).
        required: true
        type: string
      fixture-version:
        description: >-
          dbaas-operator version held fixed for the whole run, both directions (e.g. 6.15.0, no
          leading "v") — always the newer of the two versions under test.
        required: true
        type: string

permissions: {}

jobs:
  transition:
    name: ${{ inputs.direction }} ${{ inputs.initial-version }} -> ${{ inputs.target-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    concurrency:
      group: dbaas-transition-${{ inputs.direction }}-${{ github.ref }}
      cancel-in-progress: false

    env:
      KIND_CLUSTER: kind
      HARNESS_DIR: ${{ github.workspace }}/harness
      INITIAL_DIR: ${{ github.workspace }}/repos/qubership-dbaas-initial
      TARGET_DIR: ${{ github.workspace }}/repos/qubership-dbaas-target
      OPERATOR_CHART_DIR: ${{ github.workspace }}/repos/qubership-dbaas-fixture
      PGSKIPPER_DIR: ${{ github.workspace }}/repos/pgskipper-operator
      PG_NAMESPACE: postgres
      DBAAS_NAMESPACE: dbaas
      DBAAS_SERVICE_NAME: dbaas-aggregator
      REGION_DBAAS: database
      NODE_SELECTOR_DBAAS_KEY: region
      AGGREGATOR_REPLICAS: "2"
      PROBE_IMAGE_REPOSITORY: dbaas-availability-probe
      PROBE_IMAGE_TAG: it
      INITIAL_TAG: v${{ inputs.initial-version }}
      TARGET_TAG: v${{ inputs.target-version }}
      OPERATOR_TAG: v${{ inputs.fixture-version }}

    steps:
      - name: Checkout harness (Helmfile, probe, and KUTTL test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false

      - name: Checkout initial-version dbaas (aggregator chart only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Netcracker/qubership-dbaas
          ref: ${{ env.INITIAL_TAG }}
          path: repos/qubership-dbaas-initial
          persist-credentials: false

      - name: Checkout target-version dbaas (aggregator chart only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Netcracker/qubership-dbaas
          ref: ${{ env.TARGET_TAG }}
          path: repos/qubership-dbaas-target
          persist-credentials: false

      - name: Checkout fixture-version dbaas (fixed operator chart and resource profile)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Netcracker/qubership-dbaas
          ref: ${{ env.OPERATOR_TAG }}
          path: repos/qubership-dbaas-fixture
          persist-credentials: false

      - name: Checkout pgskipper-operator (pinned commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Netcracker/pgskipper-operator
          # Version 1.55.0 includes the Patroni leader-label fix required by this test.
          ref: e05bed81afa7e81a59d4724a2d7f228fd7a72232 # tag: 1.55.0
          path: repos/pgskipper-operator
          persist-credentials: false

      - name: Set up Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          cluster_name: kind
          config: harness/test-apps/dbaas-transition-test/testdata/kind.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install KUTTL (pinned release, checksum-verified)
        run: |
          set -euo pipefail
          KUTTL_VERSION=0.27.0
          KUTTL_BINARY=kubectl-kuttl_${KUTTL_VERSION}_linux_x86_64
          KUTTL_SHA256=ead175622128c043cd5f90fc7f9ed07602d064e02a8bec89632be801f83c6490
          curl -sSLO "https://github.com/kudobuilder/kuttl/releases/download/v${KUTTL_VERSION}/${KUTTL_BINARY}"
          echo "${KUTTL_SHA256}  ${KUTTL_BINARY}" | sha256sum -c -
          install -m 0755 -D "${KUTTL_BINARY}" "$RUNNER_TEMP/kuttl-bin/kubectl-kuttl"
          echo "$RUNNER_TEMP/kuttl-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kuttl-bin/kubectl-kuttl" version

      - name: Install Helmfile (pinned release, checksum-verified)
        run: |
          set -euo pipefail
          HELMFILE_VERSION=1.8.0
          HELMFILE_ARCHIVE=helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz
          HELMFILE_SHA256=35d5d39fc608342b23fc7ce1dd0c3bf0c96cc07ec3796507ab6894a5d172bf20
          curl -sSLO "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/${HELMFILE_ARCHIVE}"
          echo "${HELMFILE_SHA256}  ${HELMFILE_ARCHIVE}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helmfile-bin"
          tar -xzf "${HELMFILE_ARCHIVE}" -C "$RUNNER_TEMP/helmfile-bin" helmfile
          chmod 0755 "$RUNNER_TEMP/helmfile-bin/helmfile"
          echo "$RUNNER_TEMP/helmfile-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/helmfile-bin/helmfile" version

      - name: Build dbaas-availability-probe image and load into kind
        run: |
          docker build -t dbaas-availability-probe:it harness/test-apps/dbaas-availability-probe
          kind load docker-image dbaas-availability-probe:it --name "$KIND_CLUSTER"

      - name: Generate and mask test credentials
        run: |
          set -euo pipefail
          for var in POSTGRES_PASSWORD DBAAS_CLUSTER_DBA_CREDENTIALS_PASSWORD DBAAS_TENANT_PASSWORD \
                     DBAAS_DB_EDITOR_CREDENTIALS_PASSWORD DISCR_TOOL_USER_PASSWORD BACKUP_DAEMON_DBAAS_ACCESS_PASSWORD; do
            value="$(openssl rand -hex 20)"
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
          done

      - name: Provision transition environment
        env:
          AGGREGATOR_CHART_DIR: ${{ env.INITIAL_DIR }}
          AGGREGATOR_TAG: ${{ env.INITIAL_TAG }}
        run: helmfile -f "$HARNESS_DIR/test-infrastructure/helmfile/helmfile.yaml.gotmpl" sync

      - name: Run DBaaS transition availability test
        working-directory: harness/test-apps/dbaas-transition-test
        run: timeout 55m kubectl kuttl test --config kuttl-test.yaml --artifacts-dir "$GITHUB_WORKSPACE/diagnostics"

      - name: Collect diagnostics
        if: always()
        env:
          OUT_DIR: ${{ github.workspace }}/diagnostics
          EXTRA_DEPLOYMENTS: dbaas-availability-probe:${{ env.DBAAS_NAMESPACE }}
          AGGREGATOR_LOG_MODE: health-only
        run: |
          set -uo pipefail
          bash harness/.github/scripts/collect-dbaas-logs.sh || true

          helm -n "$DBAAS_NAMESPACE" status dbaas-aggregator > "$OUT_DIR/helm-status-dbaas-aggregator.txt" 2>&1 || true
          helm -n "$DBAAS_NAMESPACE" history dbaas-aggregator > "$OUT_DIR/helm-history-dbaas-aggregator.txt" 2>&1 || true
          # Redact credentials before uploading Helm values.
          helm -n "$DBAAS_NAMESPACE" get values dbaas-aggregator -o yaml 2>/dev/null \
            | sed -E 's/^(.*(PASSWORD|CREDENTIALS)[A-Za-z_]*:).*/\1 "***REDACTED***"/' \
            > "$OUT_DIR/helm-values-dbaas-aggregator.sanitized.yaml" || true
          cp /tmp/dbaas-transition-*.txt /tmp/dbaas-transition-probe.jsonl "$OUT_DIR/" 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbaas-transition-${{ inputs.direction }}-diagnostics
          path: ${{ github.workspace }}/diagnostics/**
          if-no-files-found: warn
