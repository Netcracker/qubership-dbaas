name: DBaaS Transition (reusable)

# Runs one direction (upgrade or downgrade) of the dbaas-aggregator availability test in a fresh Kind
# cluster. The initial and target checkouts supply only their own dbaas-aggregator chart — nothing
# else is taken from them. The fixture checkout (always the newer of the two versions, regardless of
# direction) supplies the dbaas-operator chart and resource profile, so the operator never has to
# match whichever aggregator version happens to be "initial" for a given direction and stays fixed
# throughout. pgskipper supplies PostgreSQL/Patroni and the PostgreSQL adapter, pinned to a commit
# that works with both aggregator versions. The harness (this branch) supplies the sample-service
# chart and image and the probe image.
#
# Ownership is split three ways. This file prepares the Kind cluster, the images, and the generated
# credentials, then runs Helmfile once (test-apps/dbaas-transition-test/helmfile.yaml.gotmpl) to
# provision the whole initial environment — Patroni, the initial aggregator, the operator, the
# adapter, and the sample service — as declared Helm releases with explicit dependencies. From there,
# KUTTL (test-apps/dbaas-transition-test/{kuttl-test.yaml,cases/}) owns only the test itself: it
# confirms the environment is ready, runs the preflight check, starts the continuous probe, drives
# the transition by re-syncing the aggregator release alone through the same Helmfile state, and
# evaluates the result. The continuous probe performs the availability measurements throughout.
#
# Called twice per run by dbaas-upgrade-downgrade.yml — once per direction — each getting its
# own Kind cluster, so an upgrade-direction failure can never be caused by downgrade-direction state.

on:
  workflow_call:
    inputs:
      direction:
        description: Which transition this run performs (upgrade or downgrade).
        required: true
        type: string
      initial-version:
        description: dbaas-aggregator version the environment starts on (e.g. 6.14.1, no leading "v").
        required: true
        type: string
      target-version:
        description: dbaas-aggregator version the Helm release is transitioned to (e.g. 6.15.0).
        required: true
        type: string
      fixture-version:
        description: >-
          dbaas-operator version held fixed for the whole run, both directions (e.g. 6.15.0, no
          leading "v") — always the newer of the two versions under test.
        required: true
        type: string

permissions: {}

jobs:
  transition:
    name: ${{ inputs.direction }} ${{ inputs.initial-version }} -> ${{ inputs.target-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    concurrency:
      group: dbaas-transition-${{ inputs.direction }}-${{ github.ref }}
      cancel-in-progress: false

    env:
      KIND_CLUSTER: kind
      HARNESS_DIR: ${{ github.workspace }}/harness
      REPOS_DIR: ${{ github.workspace }}/repos
      INITIAL_DIR: ${{ github.workspace }}/repos/qubership-dbaas-initial
      TARGET_DIR: ${{ github.workspace }}/repos/qubership-dbaas-target
      FIXTURE_DIR: ${{ github.workspace }}/repos/qubership-dbaas-fixture
      PG_NAMESPACE: postgres
      DBAAS_NAMESPACE: dbaas
      DBAAS_SERVICE_NAME: dbaas-aggregator
      REGION_DBAAS: database
      NODE_SELECTOR_DBAAS_KEY: region
      GO_IMAGE_REPOSITORY: go-test-app-service
      GO_IMAGE_TAG: it
      PROBE_IMAGE_REPOSITORY: dbaas-availability-probe
      PROBE_IMAGE_TAG: it
      # Every published dbaas-aggregator / dbaas-operator release tag and image tag in this repo's GHCR
      # packages carries a leading "v" (verified against ghcr.io/v2/netcracker/qubership-dbaas and
      # ghcr.io/v2/netcracker/qubership-dbaas-operator's tag lists) even though the workflow_dispatch
      # inputs are given without one, matching the release page's display title.
      INITIAL_TAG: v${{ inputs.initial-version }}
      TARGET_TAG: v${{ inputs.target-version }}
      FIXTURE_TAG: v${{ inputs.fixture-version }}

    steps:
      - name: Checkout harness (current branch — the transition test module, sample-service chart/image)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false

      - name: Checkout initial-version dbaas (aggregator chart only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Netcracker/qubership-dbaas
          ref: ${{ env.INITIAL_TAG }}
          path: repos/qubership-dbaas-initial
          persist-credentials: false

      - name: Checkout target-version dbaas (aggregator chart only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Netcracker/qubership-dbaas
          ref: ${{ env.TARGET_TAG }}
          path: repos/qubership-dbaas-target
          persist-credentials: false

      - name: Checkout fixture-version dbaas (fixed operator chart and resource profile)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Netcracker/qubership-dbaas
          ref: ${{ env.FIXTURE_TAG }}
          path: repos/qubership-dbaas-fixture
          persist-credentials: false

      - name: Checkout pgskipper-operator (pinned commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Netcracker/pgskipper-operator
          # Tag 1.55.0 (Sep 1, 2026) — the first pgskipper-operator release after dbaas v6.15.0
          # (Aug 31, 2026) and close after v6.14.1 (Aug 19, 2026); includes the patroni leader-label
          # fix from pgskipper PR #583 (see test-docs/patroni-leader-label-ci-failure.md). Pinned to
          # the commit, not the mutable tag, per this workflow's own SHA-pinning rule; update this
          # comment together with the SHA if the pin is ever deliberately moved.
          ref: e05bed81afa7e81a59d4724a2d7f228fd7a72232 # tag: 1.55.0
          path: repos/pgskipper-operator
          persist-credentials: false

      - name: Set up Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          cluster_name: kind
          config: harness/test-apps/dbaas-transition-test/testdata/kind.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install KUTTL (pinned release, checksum-verified)
        run: |
          set -euo pipefail
          KUTTL_VERSION=0.27.0
          KUTTL_BINARY=kubectl-kuttl_${KUTTL_VERSION}_linux_x86_64
          KUTTL_SHA256=ead175622128c043cd5f90fc7f9ed07602d064e02a8bec89632be801f83c6490
          curl -sSLO "https://github.com/kudobuilder/kuttl/releases/download/v${KUTTL_VERSION}/${KUTTL_BINARY}"
          echo "${KUTTL_SHA256}  ${KUTTL_BINARY}" | sha256sum -c -
          install -m 0755 -D "${KUTTL_BINARY}" "$RUNNER_TEMP/kuttl-bin/kubectl-kuttl"
          echo "$RUNNER_TEMP/kuttl-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kuttl-bin/kubectl-kuttl" version

      - name: Install Helmfile (pinned release, checksum-verified)
        run: |
          set -euo pipefail
          HELMFILE_VERSION=1.8.0
          HELMFILE_ARCHIVE=helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz
          HELMFILE_SHA256=35d5d39fc608342b23fc7ce1dd0c3bf0c96cc07ec3796507ab6894a5d172bf20
          curl -sSLO "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/${HELMFILE_ARCHIVE}"
          echo "${HELMFILE_SHA256}  ${HELMFILE_ARCHIVE}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helmfile-bin"
          tar -xzf "${HELMFILE_ARCHIVE}" -C "$RUNNER_TEMP/helmfile-bin" helmfile
          chmod 0755 "$RUNNER_TEMP/helmfile-bin/helmfile"
          echo "$RUNNER_TEMP/helmfile-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/helmfile-bin/helmfile" version

      - name: Build go-test-app-service image from harness source and load into kind
        run: |
          docker build -t go-test-app-service:it harness/test-apps/go-test-app-service
          kind load docker-image go-test-app-service:it --name "$KIND_CLUSTER"

      - name: Build dbaas-availability-probe image and load into kind
        run: |
          docker build -f harness/test-apps/dbaas-transition-test/Dockerfile.probe \
            -t dbaas-availability-probe:it harness/test-apps/dbaas-transition-test
          kind load docker-image dbaas-availability-probe:it --name "$KIND_CLUSTER"

      - name: Generate and mask test credentials
        run: |
          set -euo pipefail
          for var in POSTGRES_PASSWORD DBAAS_CLUSTER_DBA_CREDENTIALS_PASSWORD DBAAS_TENANT_PASSWORD \
                     DBAAS_DB_EDITOR_CREDENTIALS_PASSWORD DISCR_TOOL_USER_PASSWORD BACKUP_DAEMON_DBAAS_ACCESS_PASSWORD; do
            value="$(openssl rand -hex 20)"
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
          done

      - name: Provision transition environment
        # One full `helmfile sync` installs everything the test starts from: Patroni, the initial
        # aggregator, the operator, the adapter, and the sample service — see
        # test-apps/dbaas-transition-test/helmfile.yaml.gotmpl for the release list and dependency
        # order. AGGREGATOR_CHART_DIR/AGGREGATOR_TAG select the initial aggregator version here;
        # cases/transition/04-transition later re-syncs only that one release onto the target
        # version, through the same state file.
        working-directory: harness/test-apps/dbaas-transition-test
        env:
          AGGREGATOR_CHART_DIR: ${{ env.INITIAL_DIR }}
          AGGREGATOR_TAG: ${{ env.INITIAL_TAG }}
        run: helmfile sync

      - name: Run DBaaS transition availability test
        working-directory: harness/test-apps/dbaas-transition-test
        # Timeout ordering: each KUTTL step below has its own explicit timeout (the inner layer);
        # the `timeout` wrapper here is the outer command deadline; timeout-minutes above is the
        # job's own outermost bound — inner < outer < job, same ordering the previous Go harness's
        # SpecTimeout/`go test -timeout`/job timeout-minutes preserved.
        run: timeout 55m kubectl kuttl test --config kuttl-test.yaml --artifacts-dir "$GITHUB_WORKSPACE/diagnostics"

      # KUTTL collectors cover assertion failures. Capture fallback diagnostics for failures in
      # command steps such as Helm installation, preflight checks, and probe evaluation.
      - name: Collect diagnostics
        if: always()
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/diagnostics"
          mkdir -p "$OUT"

          kubectl get pods,deployments,replicasets,endpoints -A -o wide > "$OUT/all-resources.txt" 2>&1 || true
          kubectl -n "$DBAAS_NAMESPACE" get events --sort-by=.lastTimestamp > "$OUT/events-dbaas.txt" 2>&1 || true
          kubectl -n "$PG_NAMESPACE" get events --sort-by=.lastTimestamp > "$OUT/events-postgres.txt" 2>&1 || true

          helm -n "$DBAAS_NAMESPACE" status dbaas-aggregator > "$OUT/helm-status-dbaas-aggregator.txt" 2>&1 || true
          helm -n "$DBAAS_NAMESPACE" history dbaas-aggregator > "$OUT/helm-history-dbaas-aggregator.txt" 2>&1 || true
          # Never uploaded unsanitized: credential-key values are redacted before this file is written.
          helm -n "$DBAAS_NAMESPACE" get values dbaas-aggregator -o yaml 2>/dev/null \
            | sed -E 's/^(.*(PASSWORD|CREDENTIALS)[A-Za-z_]*:).*/\1 "***REDACTED***"/' \
            > "$OUT/helm-values-dbaas-aggregator.sanitized.yaml" || true

          # Raw aggregator logs carry encrypted password fields — only this known health-warning
          # allowlist is ever captured, never a full log dump.
          HEALTH_PATTERN='\[class=AdapterHealthCheck\] [A-Za-z0-9_-]+ [A-Za-z0-9_.:-]+ has problem\. Status: (PROBLEM|UNKNOWN|DOWN)$|\[class=AbstractDbaasAdapterRESTClient\] Failed to get health of adapter of type [A-Za-z0-9_-]+$|\[class=DbaasPostgresConnectHealthCheck\] Postgres connection is lost$'
          for pod in $(kubectl -n "$DBAAS_NAMESPACE" get pods -l name=dbaas-aggregator -o name 2>/dev/null); do
            {
              echo "--- ${pod#pod/} current ---"
              kubectl -n "$DBAAS_NAMESPACE" logs "$pod" --tail=5000 2>/dev/null | grep -E "$HEALTH_PATTERN" || true
              echo "--- ${pod#pod/} previous ---"
              kubectl -n "$DBAAS_NAMESPACE" logs "$pod" --previous --tail=5000 2>/dev/null | grep -E "$HEALTH_PATTERN" || true
            } >> "$OUT/dbaas-aggregator.health-evidence.txt"
          done

          for pair in "dbaas-operator:$DBAAS_NAMESPACE" "go-test-app-service:$DBAAS_NAMESPACE" \
                      "dbaas-availability-probe:$DBAAS_NAMESPACE" "dbaas-postgres-adapter:$PG_NAMESPACE"; do
            deploy="${pair%%:*}"; ns="${pair##*:}"
            selector=$(kubectl get deploy "$deploy" -n "$ns" \
              -o go-template='{{range $k,$v := .spec.selector.matchLabels}}{{printf "%s=%s\n" $k $v}}{{end}}' 2>/dev/null | paste -sd, -) \
              || selector=""
            [ -z "$selector" ] && continue
            for pod in $(kubectl -n "$ns" get pods -l "$selector" -o name 2>/dev/null); do
              name=${pod#pod/}
              kubectl -n "$ns" logs "$pod" --tail=2000 > "$OUT/$name.log" 2>&1 || true
              kubectl -n "$ns" logs "$pod" --previous --tail=2000 > "$OUT/$name.previous.log" 2>&1 || true
            done
          done

          kubectl -n "$DBAAS_NAMESPACE" logs job/dbaas-fixture-preflight --all-containers=true > "$OUT/job-dbaas-fixture-preflight.log" 2>&1 || true
          cp /tmp/dbaas-transition-*.txt /tmp/dbaas-transition-probe.jsonl "$OUT/" 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbaas-transition-${{ inputs.direction }}-diagnostics
          path: ${{ github.workspace }}/diagnostics/**
          if-no-files-found: warn
