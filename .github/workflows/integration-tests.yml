name: DBaaS Integration Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

# A new commit on a pull request cancels the run for the previous commit.
# Other events get a group per run, so scheduled, manual, and called runs
# keep their previous behavior.
concurrency:
  group: >-
    dbaas-integration-tests-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Detect DBaaS integration scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Detect applicable event
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          run=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            run=false
            if [ "$PR_AUTHOR_ID" = "29139614" ] && [ "$PR_HEAD_REPOSITORY" = "$REPOSITORY" ]; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  integration-tests:
    needs: [scope]
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # Reads the producer workflow runs and downloads their image artifacts.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # On pull requests, the images come from the maven-build.yaml and
      # go-build.yml runs for the exact PR head commit. They are never pulled
      # from GHCR, and a missing or failed producer run fails this job.
      - name: Find producer workflow runs
        id: producers
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          find_run() {
            local workflow="$1" run_id attempt
            for attempt in $(seq 1 40); do
              run_id=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" \
                --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')
              if [ -n "$run_id" ]; then
                echo "$run_id"
                return 0
              fi
              echo "Waiting for a $workflow run on $HEAD_SHA (attempt $attempt)" >&2
              sleep 15
            done
            echo "::error::No $workflow pull_request run exists for $HEAD_SHA" >&2
            return 1
          }

          maven_run_id=$(find_run maven-build.yaml)
          go_run_id=$(find_run go-build.yml)
          echo "maven-build.yaml run: $maven_run_id"
          echo "go-build.yml run: $go_run_id"
          echo "maven-run-id=$maven_run_id" >> "$GITHUB_OUTPUT"
          echo "go-run-id=$go_run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Maven build
        if: github.event_name == 'pull_request'
        uses: netcracker/qubership-workflow-hub/actions/wait-for-workflow@0eefd4976131d113c986281eed8bc642b6da303d # v2.8.1
        with:
          workflow: ${{ steps.producers.outputs.maven-run-id }}
          token: ${{ github.token }}
          timeout: 120
          poll-interval: 30

      - name: Wait for Go build
        if: github.event_name == 'pull_request'
        uses: netcracker/qubership-workflow-hub/actions/wait-for-workflow@0eefd4976131d113c986281eed8bc642b6da303d # v2.8.1
        with:
          workflow: ${{ steps.producers.outputs.go-run-id }}
          token: ${{ github.token }}
          timeout: 60
          poll-interval: 30

      - name: Download Maven image archive
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dbaas-pr-images
          path: ${{ runner.temp }}/pr-images/maven
          run-id: ${{ steps.producers.outputs.maven-run-id }}
          github-token: ${{ github.token }}

      - name: Download Operator image archive
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dbaas-operator-pr-image
          path: ${{ runner.temp }}/pr-images/go
          run-id: ${{ steps.producers.outputs.go-run-id }}
          github-token: ${{ github.token }}

      - name: Load PR images into Docker
        if: github.event_name == 'pull_request'
        env:
          IMAGE_TAG: pr-${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          load_archive() {
            local archive="$1"
            shift
            local loaded image
            loaded=$(docker load --input "$archive")
            echo "$loaded"
            for image in "$@"; do
              if ! grep -Fxq "Loaded image: $image" <<<"$loaded"; then
                echo "::error::$archive does not contain $image"
                exit 1
              fi
            done
          }

          load_archive "$RUNNER_TEMP/pr-images/maven/dbaas-images.tar" \
            "ghcr.io/netcracker/qubership-dbaas:$IMAGE_TAG" \
            "ghcr.io/netcracker/qubership-dbaas-validation-image:$IMAGE_TAG"
          load_archive "$RUNNER_TEMP/pr-images/go/operator-image.tar" \
            "ghcr.io/netcracker/qubership-dbaas-operator:$IMAGE_TAG"

      - name: Create kind config
        run: |
          cat <<EOF > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          kubeadmConfigPatches:
            - |
              kind: ClusterConfiguration
              apiServer:
                extraArgs:
                  - name: enable-admission-plugins
                    value: NodeRestriction,OwnerReferencesPermissionEnforcement
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          EOF

      - name: Set up Kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          # kind v0.32.0 is the first release that generates kubeadm v1beta4
          # config; the admission-plugin patch in kind-config.yaml uses its list-form extraArgs.
          version: v0.33.0
          cluster_name: kind
          config: kind-config.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '26.0.2+101'
          distribution: 'temurin'
          cache: maven

      - name: Deploy Fluent Bit
        run: |
          kubectl apply -f .github/declarations/fluent-bit-logging.yaml

      - name: Create namespace minio
        run: |
          kubectl create namespace minio \
          --dry-run=client -o yaml | kubectl apply -f -

      - name: Create MinIO env secret
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: minio-env
            namespace: minio
          type: Opaque
          stringData:
            config.env: |
              export MINIO_ROOT_USER=minio
              export MINIO_ROOT_PASSWORD=minio123
          EOF

      - name: Apply MinIO operator
        run: |
          kubectl kustomize "github.com/minio/operator?ref=v7.1.1" \
          | kubectl apply -f -

      - name: Wait for MinIO operator
        run: kubectl wait -n minio-operator --for=condition=Available deployment/minio-operator --timeout=300s

      - name: Deploy MinIO Tenant
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: minio.min.io/v2
          kind: Tenant
          metadata:
            name: test-minio
            namespace: minio
          spec:
            image: ghcr.io/netcracker/qubership-minio:RELEASE.2026-04-03-T08-21-58Z
            buckets:
              - name: dbaas-backup-restore-test
            configuration:
              name: minio-env
            requestAutoCert: false
            pools:
              - servers: 1
                name: pool-0
                volumesPerServer: 1
                volumeClaimTemplate:
                  metadata:
                    name: data
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 2Gi
          EOF

      - name: Wait for MinIO Tenant readiness
        run: |
          echo "Waiting for MinIO Tenant to become Ready..."

          for i in {1..30}; do
            STATE=$(kubectl get tenant test-minio -n minio -o jsonpath='{.status.currentState}')
            echo "Current state: $STATE"
            if [[ "$STATE" == "Ready" || "$STATE" == "Initialized" ]]; then
              echo "MinIO Tenant is ready"
              exit 0
            fi
            sleep 10
          done

          echo "MinIO Tenant did not become ready in time"
          exit 1

      - name: Create config file patroni-services-values.yaml
        run: |
          cat <<'EOF' > "$GITHUB_WORKSPACE/patroni-services-values.yaml"
          postgresPassword: ${POSTGRES_PASSWORD}

          backupDaemon:
            install: true
            storage:
              type: s3
            s3Storage:
              url: http://minio.minio.svc.cluster.local
              accessKeyId: minio
              secretAccessKey: minio123
              bucket: dbaas-backup-restore-test
              untrustedCert: true
            securityContext:
              runAsUser: 101
              fsGroup: 101
            s3Aliases:
              - name: default
                spec:
                  storageServerUrl: http://minio.minio.svc.cluster.local
                  storageBucket: dbaas-backup-restore-test
                  storageUsername: minio
                  storageRegion: region123
                secretContent:
                  storagePassword: minio123

          dbaas:
            install: true
            aggregator:
              registrationAddress: http://${DBAAS_SERVICE_NAME}.${DBAAS_NAMESPACE}.svc.cluster.local:8080
              registrationUsername: cluster-dba
              registrationPassword: password
          EOF

      - name: Compute DBaaS image tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            IMAGE_TAG="pr-$PR_HEAD_SHA"
          else
            SAFE_REF="${SOURCE_REF//\//-}"
            if [ "$SAFE_REF" = "main" ]; then
              IMAGE_TAG=latest
            else
              IMAGE_TAG="${SAFE_REF}-snapshot"
            fi
          fi
          echo "Calculated image tag: $IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "DBAAS_OPERATOR_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Load PR images into Kind
        if: github.event_name == 'pull_request'
        run: |
          kind load docker-image \
            "ghcr.io/netcracker/qubership-dbaas:$IMAGE_TAG" \
            "ghcr.io/netcracker/qubership-dbaas-operator:$IMAGE_TAG" \
            "ghcr.io/netcracker/qubership-dbaas-validation-image:$IMAGE_TAG" \
            --name kind

      - name: Resolve aggregator image
        id: aggregator_image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/wait-for-image-tag
        with:
          package: qubership-dbaas
          tag: ${{ env.IMAGE_TAG }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          timeout-seconds: "0"
          fallback-tag: latest

      - name: Resolve operator image
        id: operator_image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/wait-for-image-tag
        with:
          package: qubership-dbaas-operator
          tag: ${{ env.IMAGE_TAG }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          timeout-seconds: "0"
          fallback-tag: latest

      - name: Set registry image tags
        if: github.event_name != 'pull_request'
        env:
          AGGREGATOR_TAG: ${{ steps.aggregator_image.outputs['resolved-tag'] }}
          OPERATOR_TAG: ${{ steps.operator_image.outputs['resolved-tag'] }}
        run: |
          echo "TAG=$AGGREGATOR_TAG" >> "$GITHUB_ENV"
          echo "DBAAS_OPERATOR_TAG=$OPERATOR_TAG" >> "$GITHUB_ENV"

      - name: Deploy DBaaS
        working-directory: bootstrap
        run: make install CONFIG_FILE=local.mk KUBERNETES_M2M_ENABLED=true OPERATOR_M2M_ENABLED=false PATRONI_SERVICES_VALUES_FILE=$GITHUB_WORKSPACE/patroni-services-values.yaml REPOS_DIR=$(dirname $GITHUB_WORKSPACE)

      - name: Wait for postgres-backup-daemon
        run: |
          kubectl rollout status deployment/postgres-backup-daemon \
            -n postgres \
            --timeout=300s

      - name: Dump cluster diagnostics on deploy failure
        if: failure()
        run: |
          set +e
          echo "::group::All pods (all namespaces)"
          kubectl get pods -A -o wide
          echo "::endgroup::"
          for pair in "dbaas-operator:dbaas" "dbaas-aggregator:dbaas" "postgres-backup-daemon:postgres"; do
            d="${pair%%:*}"; ns="${pair##*:}"
            echo "::group::describe deploy/$d ($ns)"
            kubectl -n "$ns" describe deploy/"$d"
            echo "::endgroup::"
            echo "::group::describe pods $d ($ns)"
            kubectl -n "$ns" describe pod -l "app.kubernetes.io/name=$d"
            echo "::endgroup::"
            echo "::group::logs $d ($ns, current)"
            kubectl -n "$ns" logs deploy/"$d" --all-containers=true --tail=300
            echo "::endgroup::"
            echo "::group::logs $d ($ns, PREVIOUS/crash)"
            kubectl -n "$ns" logs deploy/"$d" --all-containers=true --previous --tail=300
            echo "::endgroup::"
          done
          echo "::group::Recent events (ns=dbaas)"
          kubectl -n dbaas get events --sort-by=.lastTimestamp | tail -80
          echo "::endgroup::"
          echo "::group::Recent events (ns=postgres)"
          kubectl -n postgres get events --sort-by=.lastTimestamp | tail -40
          echo "::endgroup::"

      - name: Run tests
        id: tests
        run: mvn --batch-mode -Dmaven.test.failure.ignore=true -DskipIT="false" -Dclouds.cloud.name="kind-kind" -Dclouds.cloud.namespaces.namespace="dbaas" test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggregate Surefire reports
        id: collect_reports
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          for module in $(find . -type d -path "*/target/surefire-reports" | sed -E 's#/target/surefire-reports##' | sort -u); do
            modname=$(basename "$module")
            echo "Found test reports for $modname"
            mkdir -p artifacts/$modname
            cp -r "$module/target/surefire-reports" artifacts/$modname/ || true
            if [ -d "$module/target/reports" ]; then
              cp -r "$module/target/reports" artifacts/$modname/ || true
            fi
          done

      - name: Upload Surefire reports
        id: upload_surefire
        if: always() && steps.collect_reports.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports
          path: artifacts/*

      - name: Collect pod stdout (Fluent Bit)
        id: collect_fluentbit_logs
        if: always()
        run: |
          chmod +x .github/scripts/collect-fluentbit-logs.sh && \
          .github/scripts/collect-fluentbit-logs.sh

      - name: Upload pod stdout (Fluent Bit)
        if: always() && steps.collect_fluentbit_logs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dbaas-pod-stdout
          path: fluentbit-logs/**
          if-no-files-found: warn

      - name: Collect MinIO diagnostics
        id: collect_minio_logs
        if: always()
        run: |
          chmod +x .github/scripts/collect-minio-logs.sh && \
          .github/scripts/collect-minio-logs.sh

      - name: Upload MinIO diagnostics
        if: always() && steps.collect_minio_logs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minio-k8s-diagnostics
          path: minio-logs/*
          if-no-files-found: warn

      - name: Collect DBaaS diagnostics
        id: collect_logs
        if: always()
        run: |
          chmod +x .github/scripts/collect-dbaas-logs.sh && \
          .github/scripts/collect-dbaas-logs.sh

      - name: Upload DBaaS diagnostics
        if: always() && steps.collect_logs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dbaas-k8s-diagnostics
          path: logs/*

      - name: Build test report
        id: build_report
        if: always() && steps.tests.outcome != 'skipped'
        env:
          ARTIFACTS_DIR: artifacts
          OUTPUT_FILE: report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload_surefire.outputs.artifact-url }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 .github/scripts/build-test-report.py

      - name: Email test report
        if: always() && steps.build_report.outcome == 'success'
        continue-on-error: true
        # Pinned to the commit that adds email-action (#782); no release tag includes it yet.
        uses: Netcracker/qubership-workflow-hub/actions/email-action@f4a2c6f57cfdd620676d0dc7321491b33d7c214b
        env:
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_USERNAME: ${{ vars.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
        with:
          subject: ${{ steps.build_report.outputs.title }}
          # convert-markdown only applies to html-body (dawidd6/action-send-mail
          # renders markdown→HTML for the html part); body stays as the plain-text fallback.
          body: file://report.md
          html-body: file://report.md
          convert-markdown: "true"

      - name: Fail job if any tests failed
        if: always() && steps.build_report.outputs.status == 'failed'
        run: |
          echo "::error::Integration tests failed (${{ steps.build_report.outputs.failed_count }} test(s))"
          exit 1

  integration-tests-gate:
    name: DBaaS Integration Tests Gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [scope, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require integration tests for Renovate PRs
        if: >-
          needs.scope.result != 'success' ||
          (needs.scope.outputs.run != 'false' && needs.integration-tests.result != 'success')
        run: |
          echo "::error::DBaaS integration tests did not succeed"
          exit 1
