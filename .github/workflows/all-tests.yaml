name: All Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-tests:
    name: Go tests
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@ed95ad948025728db1e613a3e1a4e6a11186f541 # v2.6.2
    with:
      install-envtest: true
      envtest-version: latest
      docker-config-file: 'docker-go-dev-config.json'
      go-module-dir: 'dbaas-operator'
    secrets: inherit

  python-tests:
    name: Python agent package tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install test dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --requirement dbaas-operator/agent-packages/requirements-test.txt

      - name: Run agent package tests
        working-directory: dbaas-operator
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          found=false
          for test_dir in agent-packages/*/tests; do
            [ -d "$test_dir" ] || continue
            found=true
            python -m unittest discover -s "$test_dir" -v
          done
          if [ "$found" != true ]; then
            echo "::error::No agent package test directories were found"
            exit 1
          fi

  java-tests:
    name: Java tests
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@ed95ad948025728db1e613a3e1a4e6a11186f541 # v2.6.2
    with:
      upload-artifact: true
      java-version: 25
      maven-command: 'verify'

  all-tests-gate:
    name: All Tests Gate
    if: always() && github.event_name == 'pull_request'
    needs: [go-tests, python-tests, java-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require all test jobs
        if: >-
          needs.go-tests.result != 'success' ||
          needs.python-tests.result != 'success' ||
          needs.java-tests.result != 'success'
        run: |
          echo "::error::One or more test jobs did not succeed"
          exit 1
