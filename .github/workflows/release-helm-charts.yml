---
name: Release Helm Charts

# Releases the Helm charts and builds qubership-dbaas-transfer:<version>, the
# image the internal GitLab release pipeline takes the charts from.
# release-dbaas.yml calls it as its last job. The reusable workflow cuts
# release-<version> from main as it is when the chart job runs, which can
# include commits merged after the service release started. It then creates the
# plain <version> tag with its GitHub Release, and fails if that tag exists.
#
# Retry: use "Re-run failed jobs" on the failed run. Start a new run manually
# only if the failure came before release-<version> was pushed; otherwise
# delete release-<version>, and the <version> tag and Release if they exist,
# before starting it.

on:
  workflow_call:
    inputs:
      release:
        description: 'Release version'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version'
        required: true
        type: string

permissions:
  contents: read

run-name: ${{ github.repository }} Release ${{ inputs.release }}
concurrency:
  # One group per release version: different versions run in parallel, and a
  # retry of the same version waits instead of canceling a run that may have
  # already published charts or images. A fixed prefix, because github.workflow
  # names the caller when release-dbaas.yml calls this workflow.
  group: release-helm-charts-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  helm-charts-release:
    name: Release Helm Charts
    permissions:
      contents: write
      packages: write
    uses: netcracker/qubership-workflow-hub/.github/workflows/re-infra-helm-release.yaml@8b1f50086b028c0ad22dafd33352e2166189b742 # v2.7.0
    with:
      release: ${{ inputs.release }}
      docker-config-file: ".github/docker-build-config.json"
      helm-charts-config-file: ".github/helm-charts-release-config.yaml"
      max-parallel: 4
