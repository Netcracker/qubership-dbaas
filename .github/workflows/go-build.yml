name: Go Build

run-name: >
  Build —
  ${{ github.event_name == 'push' && format('push [{0}]', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('PR ({0}) [{1}]', github.head_ref, github.event.pull_request.title) || '' }}

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  changes:
    name: Detect Go build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect applicable changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
              || [ -z "$BASE_SHA" ] \
              || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/go-build-changed-files.txt"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
          cat "$changed_files"

          applicable_files="$RUNNER_TEMP/go-build-applicable-files.txt"
          if grep -Ev '^dbaas-operator/(docs|dev)/' "$changed_files" > "$applicable_files"; then
            cat "$applicable_files"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and test
    needs: [changes]
    if: needs.changes.outputs.run != 'false'
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@ed95ad948025728db1e613a3e1a4e6a11186f541 # v2.6.2
    with:
      install-envtest: true
      envtest-version: latest
      docker-config-file: 'docker-go-dev-config.json'
      go-module-dir: 'dbaas-operator'
      # Pull requests build the Operator image in operator-pr-image and hand it
      # to the integration tests as an Actions artifact instead of publishing to GHCR.
      skip-docker: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  # Builds the Operator image that integration-tests.yml and
  # integration-tests-sample-service.yml load into Kind for this pull request.
  # It runs on every pull request, including ones that skip the Go tests,
  # so the integration tests always find an image for the current head.
  operator-pr-image:
    name: Build PR Operator image
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE_TAG: pr-${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        run: |
          set -euo pipefail
          docker build \
            -t "ghcr.io/netcracker/qubership-dbaas-operator:$IMAGE_TAG" \
            -f dbaas-operator/Dockerfile \
            dbaas-operator

      - name: Save image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr-images"
          docker save \
            -o "$RUNNER_TEMP/pr-images/operator-image.tar" \
            "ghcr.io/netcracker/qubership-dbaas-operator:$IMAGE_TAG"

      - name: Upload image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbaas-operator-pr-image
          path: ${{ runner.temp }}/pr-images/operator-image.tar
          if-no-files-found: error
          retention-days: 3

  test-agent-packages:
    name: Test agent packages
    needs: [changes]
    if: needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --requirement dbaas-operator/agent-packages/requirements-test.txt

      - name: Run agent package tests
        working-directory: dbaas-operator
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          found=false
          for test_dir in agent-packages/*/tests; do
            if [ ! -d "$test_dir" ]; then
              continue
            fi
            found=true
            python -m unittest discover -s "$test_dir" -v
          done
          if [ "$found" != true ]; then
            echo "::error::No agent package test directories were found"
            exit 1
          fi

  # CRDs, DeepCopy and the chart's CRD templates are generated from the markers in
  # api/v1. Regenerate them here and fail if anything differs from what was committed,
  # so a stale artifact cannot reach the chart. The Helm CRD templates used to be
  # synced by hand and had already drifted — the chart shipped shortName "dbdp" while
  # the source said "dbdap", breaking every documented `kubectl get dbdap`.
  verify-generated:
    name: Verify generated artifacts
    needs: [changes]
    if: needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dbaas-operator/go.mod
          cache-dependency-path: dbaas-operator/go.sum

      - name: Regenerate and check for drift
        working-directory: dbaas-operator
        run: |
          make manifests generate sync-helm-crds
          # git status --porcelain, unlike git diff, also reports untracked
          # files — a brand-new CRD whose generated artifacts were never
          # committed must fail the check too.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated artifacts are stale. Run 'make manifests generate sync-helm-crds' in dbaas-operator/ and commit the result."
            exit 1
          fi

  go-build-gate:
    name: Go Build Gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [changes, build, test-agent-packages, verify-generated, operator-pr-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require Go validation when applicable
        if: >-
          needs.changes.result != 'success' ||
          needs.operator-pr-image.result != 'success' ||
          (needs.changes.outputs.run != 'false' &&
           (needs.build.result != 'success' ||
            needs.test-agent-packages.result != 'success' ||
            needs.verify-generated.result != 'success'))
        run: |
          echo "::error::Go validation did not succeed"
          exit 1
