---
name: Maven build

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  mvn:
    uses: netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@ed95ad948025728db1e613a3e1a4e6a11186f541 # v2.6.2
    with:
      upload-artifact: true
      java-version: 25
      maven-command: 'verify'

  maven-build-gate:
    name: Maven Build Gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [mvn]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require Maven build
        if: needs.mvn.result != 'success'
        run: |
          echo "::error::Maven build did not succeed"
          exit 1
