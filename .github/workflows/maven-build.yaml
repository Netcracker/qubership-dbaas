---
name: Maven build

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  mvn:
    uses: netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@71206242f5967ac6691337913593f8623863f711 # v2.5.2
    with:
      upload-artifact: true
      java-version: 25
      maven-command: 'verify'
