# Patroni Core values for the aggregator transition test. The pgskipper chart enables its own
# integration tests by default. Those tests mutate and restart Patroni, so disable them to keep the
# PostgreSQL fixture stable while the DBaaS availability checks run.
postgresPassword: ${POSTGRES_PASSWORD}

patroni:
  affinity:
    podAntiAffinity: {}
  replicas: ${PATRONI_REPLICAS_NUMBER}
  storage:
    storageClass: ${STORAGE_CLASS}
    size: 2Gi

tests:
  install: false
