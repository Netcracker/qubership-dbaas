backupDaemon:
  install: true
  storage:
    type: s3
  s3Storage:
    url: http://minio.minio.svc.cluster.local
    accessKeyId: minio
    secretAccessKey: minio123
    bucket: dbaas-backup-restore-test
    untrustedCert: true
  securityContext:
    runAsUser: 101
    fsGroup: 101
  s3Aliases:
    - name: default
      spec:
        storageServerUrl: http://minio.minio.svc.cluster.local
        storageBucket: dbaas-backup-restore-test
        storageUsername: minio
        storageRegion: region123
      secretContent:
        storagePassword: minio123
