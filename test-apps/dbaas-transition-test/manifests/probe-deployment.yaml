apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbaas-availability-probe
  namespace: dbaas
  labels:
    app.kubernetes.io/name: dbaas-availability-probe
    app.kubernetes.io/component: test-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dbaas-availability-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dbaas-availability-probe
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dbaas-availability-probe
          image: dbaas-availability-probe:it
          imagePullPolicy: Never
          env:
            - name: PROBE_MODE
              value: probe
            - name: AGGREGATOR_URL
              value: http://dbaas-aggregator.dbaas:8080
            - name: SAMPLE_SERVICE_URL
              value: http://go-test-app-service.dbaas:8080
            - name: PROBE_INTERVAL_MS
              value: "1000"
            - name: PROBE_REQUEST_TIMEOUT_MS
              value: "5000"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
