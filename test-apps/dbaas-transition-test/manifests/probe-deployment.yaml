# Continuous availability probe. Namespace and image are fixed constants (not per-run values), so
# this manifest needs no templating — it's applied directly through KUTTL's own `apply:`/`assert:`
# fields. Polls dbaas-aggregator and the sample service from inside the cluster every second and
# writes one JSON result line per probe cycle to stdout, which the evaluate step reads back via
# `kubectl logs`. Deliberately not reached over kubectl port-forward: a port-forward drop would be
# indistinguishable from a real outage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbaas-availability-probe
  namespace: dbaas
  labels:
    app.kubernetes.io/name: dbaas-availability-probe
    app.kubernetes.io/component: test-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dbaas-availability-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dbaas-availability-probe
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dbaas-availability-probe
          image: dbaas-availability-probe:it
          imagePullPolicy: Never
          env:
            - name: PROBE_MODE
              value: probe
            - name: AGGREGATOR_URL
              value: http://dbaas-aggregator.dbaas:8080
            - name: SAMPLE_SERVICE_URL
              value: http://go-test-app-service.dbaas:8080
            - name: PROBE_INTERVAL_MS
              value: "1000"
            - name: PROBE_REQUEST_TIMEOUT_MS
              value: "5000"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
