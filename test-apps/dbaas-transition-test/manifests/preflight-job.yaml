apiVersion: batch/v1
kind: Job
metadata:
  name: dbaas-fixture-preflight
  namespace: dbaas
spec:
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: verify-preflight
          image: dbaas-availability-probe:it
          imagePullPolicy: Never
          env:
            - name: PROBE_MODE
              value: verify-preflight
            - name: SAMPLE_SERVICE_URL
              value: "http://go-test-app-service.dbaas:8080"
            - name: AGGREGATOR_POD_1_NAME
              value: "${AGGREGATOR_POD_1_NAME}"
            - name: AGGREGATOR_POD_1_URL
              value: "http://${AGGREGATOR_POD_1_IP}:8080"
            - name: AGGREGATOR_POD_2_NAME
              value: "${AGGREGATOR_POD_2_NAME}"
            - name: AGGREGATOR_POD_2_URL
              value: "http://${AGGREGATOR_POD_2_IP}:8080"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
