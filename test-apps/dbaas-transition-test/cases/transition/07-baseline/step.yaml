# Records the measurement's start boundary now that the continuous probe is confirmed running
# (06-start-probe's assert), then lets it run for the fixed baseline window before the transition.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: date -u +%Y-%m-%dT%H:%M:%S.%NZ > /tmp/dbaas-transition-probe-start.txt
    timeout: 10
  - command: sleep 40
    timeout: 50
