apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: date -u +%Y-%m-%dT%H:%M:%S.%NZ > /tmp/dbaas-transition-transition-start.txt
    timeout: 10
  - script: >
      AGGREGATOR_CHART_DIR="$TARGET_DIR" AGGREGATOR_TAG="$TARGET_TAG"
      OPERATOR_CHART_DIR="$TARGET_DIR" OPERATOR_TAG="$TARGET_TAG"
      helmfile -f "$HARNESS_DIR/bootstrap/helmfile/helmfile.yaml.gotmpl"
      -l component=aggregator -l component=operator sync
    timeout: 1200
  - script: date -u +%Y-%m-%dT%H:%M:%S.%NZ > /tmp/dbaas-transition-transition-end.txt
    timeout: 10
