# Upgrades (or downgrades) the dbaas-aggregator release alone onto the target-version chart and
# image, via `helmfile -l component=aggregator sync` — no --include-needs, since patroni-core, the
# operator, and the adapter must stay fixed throughout the measurement (see helmfile.yaml.gotmpl's
# needs: graph). No --atomic and no cleanup-on-fail: a failed transition must stay up for diagnostics
# rather than being rolled back or deleted. transitionStart/End bracket only the Helmfile invocation
# itself.
# KUTTL runs commands from cases/transition, so helmfile.yaml.gotmpl is one level above this working
# directory.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: date -u +%Y-%m-%dT%H:%M:%S.%NZ > /tmp/dbaas-transition-transition-start.txt
    timeout: 10
  - script: >
      AGGREGATOR_CHART_DIR="$TARGET_DIR" AGGREGATOR_TAG="$TARGET_TAG"
      helmfile -f ../../helmfile.yaml.gotmpl -l component=aggregator sync
    timeout: 360
  - script: date -u +%Y-%m-%dT%H:%M:%S.%NZ > /tmp/dbaas-transition-transition-end.txt
    timeout: 10
  - script: |
      running_image=$(kubectl -n "$DBAAS_NAMESPACE" get deployment dbaas-aggregator -o jsonpath='{.spec.template.spec.containers[0].image}')
      echo "running image: $running_image"
      case "$running_image" in
        *":$TARGET_TAG") ;;
        *) echo "expected the aggregator image tag to be $TARGET_TAG, got: $running_image" >&2; exit 1 ;;
      esac
    timeout: 15
