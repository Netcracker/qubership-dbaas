# The dbaas-operator, always from the fixture checkout (the newer of the two versions under test,
# regardless of direction — it already supports both the initial and target aggregator's CR
# contract), then the PostgreSQL adapter from the pinned pgskipper checkout, then a test-only M2M
# prerequisite (OIDC issuer-discovery) that requires restarting the aggregator once both are up.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: >
      DBAAS_OPERATOR_TAG="$FIXTURE_TAG" DBAAS_NAMESPACE="$DBAAS_NAMESPACE" REGION_DBAAS="$REGION_DBAAS"
      NODE_SELECTOR_DBAAS_KEY="$NODE_SELECTOR_DBAAS_KEY" DBAAS_OPERATOR_ENABLED=true OPERATOR_M2M_ENABLED=true
      envsubst < "$HARNESS_DIR/bootstrap/dbaas-operator-values.yaml" > /tmp/dbaas-transition-operator-values.yaml
    timeout: 30
  - script: >
      helm upgrade --install dbaas-operator "$FIXTURE_DIR/dbaas-operator/helm-templates/dbaas-operator"
      --namespace "$DBAAS_NAMESPACE" -f /tmp/dbaas-transition-operator-values.yaml
      -f "$FIXTURE_DIR/dbaas-operator/helm-templates/dbaas-operator/resource-profiles/dev.yaml"
      --wait --timeout 5m
    timeout: 360
  - script: >
      make -C "$HARNESS_DIR/bootstrap" CONFIG_FILE=local.mk install-patroni-services
      REPOS_DIR="$REPOS_DIR" PG_NAMESPACE="$PG_NAMESPACE" DBAAS_NAMESPACE="$DBAAS_NAMESPACE"
      DBAAS_SERVICE_NAME="$DBAAS_SERVICE_NAME"
      PATRONI_SERVICES_VALUES_FILE="$HARNESS_DIR/test-apps/dbaas-transition-test/testdata/values/patroni-services.yaml"
    timeout: 300
  - script: >
      make -C "$HARNESS_DIR/bootstrap" CONFIG_FILE=local.mk wait-patroni-services-registration
      PG_NAMESPACE="$PG_NAMESPACE"
    timeout: 300
  - script: |
      kubectl create clusterrolebinding dbaas-aggregator-issuer-discovery \
        --clusterrole=system:service-account-issuer-discovery \
        --serviceaccount="$DBAAS_NAMESPACE":dbaas-aggregator \
        --dry-run=client -o yaml | kubectl apply -f -
    timeout: 30
  - script: |
      kubectl -n "$DBAAS_NAMESPACE" rollout restart deployment/dbaas-aggregator
      kubectl -n "$DBAAS_NAMESPACE" rollout status deployment/dbaas-aggregator --timeout=300s
    timeout: 310
