# The Deployment's own readiness/liveness probes only call /health, which never touches PostgreSQL
# — a clean rollout (already confirmed by --wait above) proves the process started, not that the
# database exists. Baseline probing must not start until provisioning genuinely finished, or a slow
# or failed provisioning would be misreported as transition downtime instead of a setup failure.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
resourceRefs:
  - apiVersion: dbaas.netcracker.com/v1
    kind: InternalDatabase
    namespace: dbaas
    name: go-test-app-service-postgres
    ref: idb
collectors:
  - type: command
    command: kubectl -n dbaas get internaldatabase go-test-app-service-postgres -o yaml
  - type: command
    command: kubectl -n dbaas logs deploy/dbaas-operator --all-containers=true --tail=500
assertAll:
  - celExpr: "idb.status.phase == 'Succeeded'"
