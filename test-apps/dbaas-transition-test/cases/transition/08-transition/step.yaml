# Upgrades (or downgrades) the dbaas-aggregator release onto the target-version chart and image
# with one `helm upgrade`, no --atomic (a failed transition must stay up for diagnostics rather
# than being auto-rolled-back), while the continuous probes remain active. transitionStart/End
# bracket only the Helm invocation itself, not the values rendering before it.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: >
      TAG="$TARGET_TAG" DBAAS_SERVICE_NAME="$DBAAS_SERVICE_NAME" REGION_DBAAS="$REGION_DBAAS"
      NODE_SELECTOR_DBAAS_KEY="$NODE_SELECTOR_DBAAS_KEY" PG_NAMESPACE="$PG_NAMESPACE"
      KUBERNETES_M2M_ENABLED=true
      BACKUP_DAEMON_DBAAS_ACCESS_PASSWORD="$BACKUP_DAEMON_DBAAS_ACCESS_PASSWORD"
      DBAAS_CLUSTER_DBA_CREDENTIALS_PASSWORD="$DBAAS_CLUSTER_DBA_CREDENTIALS_PASSWORD"
      DBAAS_TENANT_PASSWORD="$DBAAS_TENANT_PASSWORD"
      DBAAS_DB_EDITOR_CREDENTIALS_PASSWORD="$DBAAS_DB_EDITOR_CREDENTIALS_PASSWORD"
      DISCR_TOOL_USER_PASSWORD="$DISCR_TOOL_USER_PASSWORD" POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
      envsubst < "$HARNESS_DIR/test-apps/dbaas-transition-test/testdata/values/dbaas.yaml" > /tmp/dbaas-transition-target-values.yaml
    timeout: 30
  - script: date -u +%Y-%m-%dT%H:%M:%S.%NZ > /tmp/dbaas-transition-transition-start.txt
    timeout: 10
  - script: >
      helm upgrade dbaas-aggregator "$TARGET_DIR/helm-templates/dbaas-aggregator"
      --namespace "$DBAAS_NAMESPACE" -f /tmp/dbaas-transition-target-values.yaml
      --wait --timeout 5m
    timeout: 360
  - script: date -u +%Y-%m-%dT%H:%M:%S.%NZ > /tmp/dbaas-transition-transition-end.txt
    timeout: 10
  - script: |
      running_image=$(kubectl -n "$DBAAS_NAMESPACE" get deployment dbaas-aggregator -o jsonpath='{.spec.template.spec.containers[0].image}')
      echo "running image: $running_image"
      case "$running_image" in
        *":$TARGET_TAG") ;;
        *) echo "expected the aggregator image tag to be $TARGET_TAG, got: $running_image" >&2; exit 1 ;;
      esac
    timeout: 15
