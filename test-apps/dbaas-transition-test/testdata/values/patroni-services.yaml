# patroni-services (pgskipper PostgreSQL adapter) values overlay for the upgrade/downgrade availability
# test. The registration password matches the aggregator's generated cluster DBA credentials. The
# pgskipper chart's bundled integration tests are disabled because they mutate the database fixture
# and restart Patroni while this workflow is measuring DBaaS availability.
postgresPassword: ${POSTGRES_PASSWORD}

backupDaemon:
  install: false
  storage:
    storageClass: ${STORAGE_CLASS}
    type: pv
    size: 2Gi

dbaas:
  install: true
  aggregator:
    registrationAddress: http://${DBAAS_SERVICE_NAME}.${DBAAS_NAMESPACE}.svc.cluster.local:8080
    registrationUsername: cluster-dba
    registrationPassword: ${DBAAS_CLUSTER_DBA_CREDENTIALS_PASSWORD}

tests:
  install: false
