{{- if .Values.DATABASE_PROXY_STACK_ENABLED }}
apiVersion: v1
kind: Service
metadata:
  name: '{{ .Values.DBAAS_PROXY_SERVICE_NAME }}'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.DBAAS_PROXY_SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: '{{ .Values.DBAAS_PROXY_SERVICE_NAME }}'
  ports:
    - name: web
      port: 8080
      targetPort: web
{{- end }}
